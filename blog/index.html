<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog — Shakil Ahmed</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600;700&family=Syne:wght@400;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Lora:ital@0;1&display=swap"
        rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon/favicon-16x16.png">
    <style>
        /* Blog page theme — matches api-explainer.html */
        :root {
            --blog-bg: #0d0d0d;
            --blog-surface: #161616;
            --blog-card: #1e1e1e;
            --blog-border: #2a2a2a;
            --blog-accent: #f5c518;
            --blog-accent2: #ff6b35;
            --blog-accent3: #4ecdc4;
            --blog-text: #f0ece3;
            --blog-muted: #7a7570;
            --blog-green: #6bcb77;
        }

        /* Override body for blog page */
        body {
            margin-top: 0;
            padding-bottom: 0;
            background: var(--blog-bg);
            overflow: hidden;
            height: 100vh;
        }

        /* ===== Blog Layout ===== */
        .blog-wrapper {
            display: flex;
            position: fixed;
            top: 50px;
            /* below navbar */
            bottom: 40px;
            /* above footer */
            left: 0;
            right: 0;
        }

        /* ===== Sidebar ===== */
        .blog-sidebar {
            width: 32%;
            min-width: 300px;
            max-width: 460px;
            background: var(--blog-surface);
            border-right: 1px solid var(--blog-border);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px 18px 14px;
            border-bottom: 1px solid var(--blog-border);
        }

        .sidebar-header h2 {
            font-family: 'Syne', sans-serif;
            font-size: 18px;
            font-weight: 800;
            color: var(--blog-accent);
            letter-spacing: -0.5px;
            margin: 0;
        }

        .sidebar-header .sidebar-tag {
            font-family: 'DM Mono', monospace;
            font-size: 9px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--blog-muted);
            margin-top: 4px;
        }

        .blog-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .blog-entry {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 18px;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .blog-entry:hover {
            background: var(--blog-card);
            border-left-color: var(--blog-border);
        }

        .blog-entry.active {
            background: var(--blog-card);
            border-left-color: var(--blog-accent);
        }

        .blog-num {
            font-family: 'Syne', sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: var(--blog-border);
            line-height: 1;
            flex-shrink: 0;
            min-width: 28px;
            transition: color 0.2s;
        }

        .blog-entry.active .blog-num,
        .blog-entry:hover .blog-num {
            color: var(--blog-accent);
        }

        .blog-meta {
            flex: 1;
            min-width: 0;
        }

        .blog-title {
            font-family: 'Syne', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: var(--blog-text);
            line-height: 1.3;
            margin-bottom: 4px;
        }

        .blog-subtitle {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            color: var(--blog-muted);
            line-height: 1.4;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .blog-date {
            font-family: 'DM Mono', monospace;
            font-size: 9px;
            letter-spacing: 1px;
            color: var(--blog-accent2);
            margin-top: 4px;
        }

        /* ===== Main Content (iframe) ===== */
        .blog-content {
            flex: 1;
            background: var(--blog-bg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .blog-content iframe {
            width: 100%;
            flex: 1;
            border: none;
            background: var(--blog-bg);
        }

        /* Empty state */
        .blog-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--blog-muted);
            font-family: 'DM Mono', monospace;
            font-size: 14px;
            letter-spacing: 1px;
            gap: 12px;
        }

        .blog-empty .empty-icon {
            font-size: 48px;
            opacity: 0.3;
        }

        /* ===== Navbar overrides for blog page ===== */
        .navbar {
            padding: 8px 0 !important;
        }

        /* ===== Footer overrides for blog page ===== */
        .footer {
            padding: 4px 0;
        }

        .footer-content {
            margin-bottom: 0;
        }

        .footer-logo a {
            font-size: 1.1rem;
        }

        .footer-copyright {
            font-size: 0.75rem;
        }

        /* ===== Active nav link ===== */
        .nav-link.active-page {
            color: var(--terminal-green);
        }

        .nav-link.active-page::after {
            width: 100%;
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .blog-wrapper {
                flex-direction: column;
            }

            .blog-sidebar {
                width: 100%;
                max-width: none;
                min-width: auto;
                max-height: 140px;
                border-right: none;
                border-bottom: 1px solid var(--blog-border);
            }

            .sidebar-header {
                padding: 10px 14px 8px;
            }

            .sidebar-header h2 {
                font-size: 14px;
            }

            .blog-list {
                display: flex;
                overflow-x: auto;
                overflow-y: hidden;
                padding: 0;
                gap: 0;
            }

            .blog-entry {
                flex-shrink: 0;
                min-width: 160px;
                padding: 10px 14px;
                border-left: none;
                border-bottom: 3px solid transparent;
            }

            .blog-entry.active {
                border-left-color: transparent;
                border-bottom-color: var(--blog-accent);
            }

            .blog-entry:hover {
                border-left-color: transparent;
                border-bottom-color: var(--blog-border);
            }

            .blog-subtitle {
                display: none;
            }
        }
    </style>
</head>

<body>
    <!-- Navigation (same as portfolio) -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <a href="/">shakilahmed@portfolio:~$</a>
            </div>
            <div class="menu-toggle">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
            <ul class="nav-menu">
                <li><a href="/#home" class="nav-link">Home</a></li>
                <li><a href="/#about" class="nav-link">About</a></li>
                <li><a href="/#skills" class="nav-link">Skills</a></li>
                <li><a href="/#projects" class="nav-link">Projects</a></li>
                <li><a href="/#certifications" class="nav-link">Certifications</a></li>
                <li><a href="/#contact" class="nav-link">Contact</a></li>
                <li><a href="/blog/" class="nav-link active-page">Blog</a></li>
            </ul>
            <div class="ip-display">
                Detected Ip address: <a href="#" id="ip-link"><span id="user-ip">Loading...</span></a>
            </div>
        </div>
    </nav>

    <!-- Blog Layout -->
    <div class="blog-wrapper">
        <!-- Sidebar -->
        <aside class="blog-sidebar">
            <div class="sidebar-header">
                <h2>Articles</h2>
                <div class="sidebar-tag">Tech Concept Explainers</div>
            </div>
            <div class="blog-list" id="blog-list">
                <!-- Populated dynamically from blogs.json -->
            </div>
        </aside>

        <!-- Main Content -->
        <div class="blog-content" id="blog-content">
            <div class="blog-empty" id="blog-empty">
                <div class="empty-icon">📝</div>
                <span>Select an article from the sidebar</span>
            </div>
            <iframe id="blog-iframe" style="display:none;"
                sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
        </div>
    </div>

    <!-- Footer (same as portfolio) -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">
                    <a href="/">SK</a>
                </div>
                <p class="footer-copyright">&copy; 2026 Shakil Ahmed. All Rights Reserved.</p>
                <div class="footer-social">
                    <a href="https://github.com/ahmedmshakil" target="_blank">
                        <i class="fab fa-github"></i>
                    </a>
                    <a href="https://linkedin.com/in/ahmedmshakil" target="_blank">
                        <i class="fab fa-linkedin"></i>
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // --- Mobile menu toggle ---
        const menuToggle = document.querySelector('.menu-toggle');
        const navMenu = document.querySelector('.nav-menu');

        if (menuToggle) {
            menuToggle.addEventListener('click', function () {
                menuToggle.classList.toggle('active');
                navMenu.classList.toggle('active');
                const bars = document.querySelectorAll('.bar');
                if (menuToggle.classList.contains('active')) {
                    bars[0].style.transform = 'rotate(-45deg) translate(-5px, 6px)';
                    bars[1].style.opacity = '0';
                    bars[2].style.transform = 'rotate(45deg) translate(-5px, -6px)';
                } else {
                    bars[0].style.transform = 'none';
                    bars[1].style.opacity = '1';
                    bars[2].style.transform = 'none';
                }
            });
        }

        // --- Blog logic ---
        const blogList = document.getElementById('blog-list');
        const blogIframe = document.getElementById('blog-iframe');
        const blogEmpty = document.getElementById('blog-empty');
        let blogs = [];

        function loadBlog(id) {
            const blog = blogs.find(b => b.id === id);
            if (!blog) return;

            // Update active state
            document.querySelectorAll('.blog-entry').forEach(el => el.classList.remove('active'));
            const activeEl = document.querySelector(`.blog-entry[data-id="${id}"]`);
            if (activeEl) activeEl.classList.add('active');

            // Load iframe
            blogEmpty.style.display = 'none';
            blogIframe.style.display = 'block';
            blogIframe.src = blog.file;

            // Update URL hash
            history.replaceState(null, '', '#' + id);
        }

        function renderSidebar() {
            blogList.innerHTML = '';
            blogs.forEach((blog, i) => {
                const entry = document.createElement('div');
                entry.className = 'blog-entry';
                entry.dataset.id = blog.id;
                entry.innerHTML = `
                    <div class="blog-num">${i + 1}</div>
                    <div class="blog-meta">
                        <div class="blog-title">${blog.title}</div>
                        <div class="blog-subtitle">${blog.subtitle}</div>
                        <div class="blog-date">${blog.date}</div>
                    </div>
                `;
                entry.addEventListener('click', () => loadBlog(blog.id));
                blogList.appendChild(entry);
            });
        }

        // Fetch blogs.json and initialize
        fetch('blogs.json')
            .then(res => res.json())
            .then(data => {
                blogs = data;
                renderSidebar();

                // Check URL hash for initial load
                const hash = window.location.hash.slice(1);
                if (hash && blogs.find(b => b.id === hash)) {
                    loadBlog(hash);
                } else if (blogs.length > 0) {
                    loadBlog(blogs[0].id);
                }
            })
            .catch(err => {
                console.error('Failed to load blogs.json:', err);
                blogList.innerHTML = '<div style="padding:18px;color:var(--blog-muted);font-family:DM Mono,monospace;font-size:12px;">No articles found.</div>';
            });

        // Handle hash changes (browser back/forward)
        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.slice(1);
            if (hash && blogs.find(b => b.id === hash)) {
                loadBlog(hash);
            }
        });

        // --- IP Detection (same as portfolio) ---
        const userIpElement = document.getElementById('user-ip');
        const ipLinkElement = document.getElementById('ip-link');
        let ipInfoData = null;

        function isValidIP(ip) {
            const ipv4 = /^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$/;
            return ipv4.test(ip);
        }

        async function fetchIpInfo() {
            if (!userIpElement) return;
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 6000);
                const response = await fetch('https://ipinfo.io/json', {
                    signal: controller.signal,
                    headers: { 'Accept': 'application/json' }
                });
                clearTimeout(timeoutId);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                if (!data || !data.ip || !isValidIP(data.ip)) throw new Error('Invalid response');
                ipInfoData = data;
                userIpElement.textContent = data.ip;
            } catch (e) {
                console.error('IPinfo fetch failed:', e);
                if (userIpElement) userIpElement.textContent = 'Not detected';
                ipInfoData = null;
            }
        }

        if (ipLinkElement) {
            ipLinkElement.addEventListener('click', (e) => {
                e.preventDefault();
                if (!ipInfoData) {
                    alert('IP information not loaded yet. Please wait a moment.');
                    return;
                }
                localStorage.setItem('ipinfo_data', JSON.stringify(ipInfoData));
                window.open('/ipinfo/', '_blank');
            });
        }

        fetchIpInfo();
    </script>
</body>

</html>
