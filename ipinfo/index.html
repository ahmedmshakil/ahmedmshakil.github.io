<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Information Report</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../images/favicon/favicon-16x16.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #0d1117;
            color: #e6edf3;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('../images/bg-green.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.15;
            filter: blur(3px);
            z-index: 0;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            height: 100vh;
            background: #161b22;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        
        .watermark-header {
            background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
        }
        
        .watermark-header .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .watermark-header .logo-icon {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .watermark-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: white;
        }
        
        .watermark-header .date-badge {
            background: rgba(255,255,255,0.2);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: white;
        }
        
        .content {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px 30px;
            overflow-y: auto;
        }
        
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .ip-card {
            background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }
        
        .ip-card h3 {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 8px;
            color: white;
        }
        
        .ip-card .ip-value {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
            color: white;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        
        .info-card {
            background: #1c2128;
            border: 1px solid #30363d;
            border-left: 3px solid #4caf50;
            padding: 12px 16px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .info-card label {
            font-size: 12px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        
        .info-card .value {
            font-size: 14px;
            color: #4caf50;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .json-section {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            max-height: calc(100vh - 350px);
            overflow-y: auto;
            position: relative;
        }
        
        .json-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .copy-btn {
            background: transparent;
            border: 1px solid #30363d;
            color: #8b949e;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }
        
        .copy-btn:hover {
            background: #21262d;
            border-color: #4caf50;
            color: #4caf50;
        }
        
        .copy-btn.copied {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }
        
        .json-section h4 {
            color: #4caf50;
            font-size: 13px;
            margin: 0;
            font-weight: 600;
        }
        
        .json-section pre {
            margin: 0;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.6;
            color: #8b949e;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .actions {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: #4caf50;
            color: white;
        }
        
        .btn-primary:hover {
            background: #45a049;
            transform: translateY(-1px);
        }
        
        .btn-secondary {
            background: transparent;
            color: #e6edf3;
            border: 1px solid #30363d;
        }
        
        .btn-secondary:hover {
            background: #21262d;
            border-color: #4caf50;
        }
        
        .footer {
            background: #0d1117;
            padding: 15px 30px;
            border-top: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .footer .website {
            font-size: 14px;
            color: #4caf50;
            font-weight: 600;
        }
        
        .footer .author {
            font-size: 13px;
            color: #8b949e;
        }
        
        .error-message {
            text-align: center;
            padding: 40px;
            color: #8b949e;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #0d1117;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #4caf50;
        }
        
        @media print {
            body {
                height: auto;
                overflow: visible;
            }
            
            .container {
                height: auto;
            }
            
            .content {
                overflow: visible;
            }
            
            .actions {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="watermark-header">
            <div class="logo">
                <div class="logo-icon">🔒</div>
                <h1>IPinfo Report</h1>
            </div>
            <div class="date-badge" id="current-date"></div>
        </div>
        
        <div class="content" id="content">
            <div class="error-message">Loading IP information...</div>
        </div>
        
        <div class="footer">
            <div class="website">shakilahmed.live</div>
            <div class="author" id="footer-text"></div>
        </div>
    </div>

    <script>
        // Convert country code to flag emoji
        function countryCodeToFlag(countryCode) {
            if (!countryCode || countryCode.length !== 2) return '🌐';
            
            const codePoints = countryCode
                .toUpperCase()
                .split('')
                .map(char => 127397 + char.charCodeAt());
            return String.fromCodePoint(...codePoints);
        }
        
        // Copy JSON to clipboard
        function copyToClipboard() {
            const jsonContent = document.getElementById('json-content').textContent;
            const copyBtn = document.querySelector('.copy-btn');
            
            navigator.clipboard.writeText(jsonContent).then(() => {
                // Change button text to show copied state
                copyBtn.innerHTML = '✓ Copied!';
                copyBtn.classList.add('copied');
                
                // Reset after 2 seconds
                setTimeout(() => {
                    copyBtn.innerHTML = '📋 Copy';
                    copyBtn.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy:', err);
                copyBtn.innerHTML = '✗ Failed';
                setTimeout(() => {
                    copyBtn.innerHTML = '📋 Copy';
                }, 2000);
            });
        }
        
        // Load IP data from localStorage
        const ipDataStr = localStorage.getItem('ipinfo_data');
        
        if (!ipDataStr) {
            document.getElementById('content').innerHTML = `
                <div class="error-message">
                    <h2 style="color: #4caf50; margin-bottom: 10px;">No IP Data Found</h2>
                    <p>Please go back to the homepage and click on your IP address.</p>
                    <button class="btn btn-primary" onclick="window.location.href='/'">
                        Go to Homepage
                    </button>
                </div>
            `;
        } else {
            try {
                const data = JSON.parse(ipDataStr);
                const currentDate = new Date().toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
                const countryFlag = countryCodeToFlag(data.country);
                
                document.getElementById('current-date').textContent = currentDate;
                document.getElementById('footer-text').textContent = `© ${new Date().getFullYear()} Shakil Ahmed - All Rights Reserved`;
                
                document.getElementById('content').innerHTML = `
                    <div class="left-panel">
                        <div class="ip-card">
                            <h3>YOUR IP ADDRESS</h3>
                            <div class="ip-value">${data.ip || 'N/A'}</div>
                        </div>
                        
                        <div class="info-grid">
                            <div class="info-card">
                                <label>Hostname</label>
                                <div class="value">${data.hostname || 'N/A'}</div>
                            </div>
                            
                            <div class="info-card">
                                <label>City</label>
                                <div class="value">${data.city || 'N/A'}</div>
                            </div>
                            
                            <div class="info-card">
                                <label>Region</label>
                                <div class="value">${data.region || 'N/A'}</div>
                            </div>
                            
                            <div class="info-card">
                                <label>Country</label>
                                <div class="value" style="display: flex; align-items: center; gap: 8px;">
                                    <span style="font-size: 24px;">${countryFlag}</span>
                                    <span>${data.country || 'N/A'}</span>
                                </div>
                            </div>
                            
                            <div class="info-card">
                                <label>Location</label>
                                <div class="value">${data.loc || 'N/A'}</div>
                            </div>
                            
                            <div class="info-card">
                                <label>Organization</label>
                                <div class="value">${data.org || 'N/A'}</div>
                            </div>
                            
                            <div class="info-card">
                                <label>Postal Code</label>
                                <div class="value">${data.postal || 'N/A'}</div>
                            </div>
                            
                            <div class="info-card">
                                <label>Timezone</label>
                                <div class="value">${data.timezone || 'N/A'}</div>
                            </div>
                        </div>
                        
                        <div class="actions">
                            <button class="btn btn-primary" onclick="window.print()">
                                📄 Download PDF
                            </button>
                            <button class="btn btn-secondary" onclick="window.close()">
                                ✕ Close
                            </button>
                        </div>
                    </div>
                    
                    <div class="right-panel">
                        <div class="json-section">
                            <div class="json-header">
                                <h4>RAW JSON DATA</h4>
                                <button class="copy-btn" onclick="copyToClipboard()">
                                    📋 Copy
                                </button>
                            </div>
                            <pre id="json-content">${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    </div>
                `;
            } catch (error) {
                document.getElementById('content').innerHTML = `
                    <div class="error-message">
                        <h2 style="color: #f44336; margin-bottom: 10px;">Error Loading Data</h2>
                        <p>Unable to parse IP information. Please try again.</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
